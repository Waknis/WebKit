name: Event listener script layout test

# Runs http/tests/site-isolation/inspector/dom/event-listeners-routing-frame-target.html
# against WebKit's prebuilt macOS Release product for the base revision, once with the
# Web Inspector fix on this branch and once with the fix reverted. Only the Web Inspector
# resources are regenerated; nothing else is built.

on:
  push:
    branches: [ci/event-listener-script-test]
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_REVISION: "325391@main"
  ARCHIVE_PLATFORM: mac-sequoia
  ARCHIVE_URL: https://s3-us-west-2.amazonaws.com/archives.webkit.org/mac-sequoia-x86_64-arm64-release/325391@main.zip
  TARGET_TEST: http/tests/site-isolation/inspector/dom/event-listeners-routing-frame-target.html
  REGRESSION_TESTS: >-
    http/tests/site-isolation/inspector/dom
    http/tests/site-isolation/inspector/debugger/stack-trace-page-target.html
    inspector/dom
  # A sparse checkout makes run-webkit-tests warn about every TestExpectations line for a test
  # that is not checked out; drop those lines from the logs.
  NOISE: "Path does not exist"

jobs:
  layout-test:
    name: ${{ matrix.variant }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [with-fix, without-fix]

    steps:
      - name: Sparse checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /Tools/
            /Source/WebInspectorUI/
            /LayoutTests/*
            !/LayoutTests/*/
            /LayoutTests/platform/*/TestExpectations
            /LayoutTests/resources/
            /LayoutTests/media/content/test.mp4
            /LayoutTests/media/content/test.webm
            /LayoutTests/http/*
            !/LayoutTests/http/*/
            /LayoutTests/http/conf/
            /LayoutTests/http/tests/*
            !/LayoutTests/http/tests/*/
            /LayoutTests/http/tests/resources/
            /LayoutTests/http/tests/inspector/
            /LayoutTests/http/tests/site-isolation/inspector/
            /LayoutTests/inspector/

      - name: Mark the sparse checkout as a WebKit source tree
        # webkitdirs.pm finds the source root by looking for Source/WebCore and Source/JavaScriptCore.
        run: mkdir -p Source/WebCore Source/JavaScriptCore

      - name: Runner info
        run: |
          {
            echo "variant: ${{ matrix.variant }}"
            echo "commit: $(git rev-parse HEAD)"
            echo "runner: $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion)), $(uname -m)"
            echo "xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "archive: $ARCHIVE_URL"
          } | tee ci-notes.txt
          df -h .
          du -sh LayoutTests Tools Source 2>/dev/null || true
          ls -l LayoutTests/media/content || true
          echo "platform TestExpectations files: $(ls LayoutTests/platform/*/TestExpectations | wc -l)"

      - name: Download prebuilt product (${{ env.BASE_REVISION }})
        run: |
          mkdir -p WebKitBuild
          curl --fail --location --retry 3 --silent --show-error -o WebKitBuild/release.zip "$ARCHIVE_URL"
          ls -l WebKitBuild/release.zip

      - name: Extract prebuilt product
        run: |
          python3 Tools/CISupport/built-product-archive --platform="$ARCHIVE_PLATFORM" --release extract
          rm -f WebKitBuild/release.zip
          ls WebKitBuild/Release
          df -h .

      - name: Baseline - regression suites on the unmodified prebuilt Web Inspector (with-fix only)
        if: matrix.variant == 'with-fix'
        continue-on-error: true
        run: |
          set +e
          Tools/Scripts/run-webkit-tests --release --no-build --no-show-results --no-new-test-results \
            --results-directory "$PWD/layout-test-results-baseline" \
            $REGRESSION_TESTS 2>&1 | grep --line-buffered -v "$NOISE" | tee baseline.log
          status=${PIPESTATUS[0]}
          echo "run-webkit-tests exit status: $status" | tee -a baseline.log
          exit $status

      - name: Revert the fix (without-fix only)
        if: matrix.variant == 'without-fix'
        run: |
          python3 - <<'EOF'
          import re, pathlib
          p = pathlib.Path("Source/WebInspectorUI/UserInterface/Controllers/DOMManager.js")
          s = p.read_text()
          pattern = re.compile(r"(    static scriptForEventListener\(eventListener\)\n    \{\n).*?(\n    \}\n)", re.S)
          s, n = pattern.subn(r"\1        return WI.debuggerManager.scriptForIdentifier(eventListener.location.scriptId, WI.mainTarget);\2", s, count=1)
          assert n == 1, "scriptForEventListener not found"
          p.write_text(s)
          EOF
          git diff | tee revert.diff

      - name: Regenerate Web Inspector resources into WebKitBuild/Release
        run: |
          set -euo pipefail
          PRODUCT="$PWD/WebKitBuild/Release"
          FW="$PRODUCT/WebInspectorUI.framework"
          if [ -d "$FW/Versions/A/Resources" ]; then RES_REL="WebInspectorUI.framework/Versions/A/Resources"; else RES_REL="WebInspectorUI.framework/Resources"; fi
          echo "Resources folder: $RES_REL"
          ls "$PRODUCT/$RES_REL"

          # copy-user-interface-resources.pl reads InspectorBackendCommands.js from JavaScriptCore's
          # private headers and InspectorNativeFunctionParameters.json from WebCore's.
          JSC_HEADERS="$PRODUCT/JavaScriptCore.framework/PrivateHeaders"
          if [ -f "$JSC_HEADERS/InspectorBackendCommands.js" ]; then
            echo "regen: InspectorBackendCommands.js from JavaScriptCore private headers" >> ci-notes.txt
          else
            echo "::warning::InspectorBackendCommands.js not in JavaScriptCore private headers; using the product's existing copy"
            echo "regen: InspectorBackendCommands.js missing from JavaScriptCore private headers; reused the product's copy" >> ci-notes.txt
            JSC_HEADERS="$RUNNER_TEMP/jsc-headers"
            mkdir -p "$JSC_HEADERS"
            cp "$PRODUCT/$RES_REL/Protocol/InspectorBackendCommands.js" "$JSC_HEADERS/"
          fi
          WEBCORE_HEADERS="$PRODUCT/WebCore.framework/PrivateHeaders"
          if [ -f "$WEBCORE_HEADERS/InspectorNativeFunctionParameters.json" ]; then
            echo "regen: InspectorNativeFunctionParameters.json from WebCore private headers" >> ci-notes.txt
          else
            echo "::warning::InspectorNativeFunctionParameters.json missing"
            echo "regen: InspectorNativeFunctionParameters.json missing from WebCore private headers" >> ci-notes.txt
          fi

          cp "$PRODUCT/$RES_REL/TestCombined.js" "$RUNNER_TEMP/TestCombined.before.js"

          env SRCROOT="$PWD/Source/WebInspectorUI" \
              TARGET_BUILD_DIR="$PRODUCT" \
              BUILT_PRODUCTS_DIR="$PRODUCT" \
              UNLOCALIZED_RESOURCES_FOLDER_PATH="$RES_REL" \
              DERIVED_SOURCES_DIR="$RUNNER_TEMP/WebInspectorUI-DerivedSources" \
              JAVASCRIPTCORE_PRIVATE_HEADERS_DIR="$JSC_HEADERS" \
              WEBCORE_PRIVATE_HEADERS_DIR="$WEBCORE_HEADERS" \
              COMBINE_INSPECTOR_RESOURCES=NO \
              COMBINE_TEST_RESOURCES=YES \
              perl Source/WebInspectorUI/Scripts/copy-user-interface-resources.pl

          ls -l "$PRODUCT/$RES_REL/TestCombined.js" "$PRODUCT/$RES_REL/Test.html"
          echo "--- scriptForEventListener in regenerated TestCombined.js:"
          grep -n -A6 "static scriptForEventListener" "$PRODUCT/$RES_REL/TestCombined.js"
          if [ "${{ matrix.variant }}" = "with-fix" ]; then
            grep -q "scriptForStackTraceIdentifier(eventListener.location.scriptId" "$PRODUCT/$RES_REL/TestCombined.js"
          else
            grep -q "scriptForIdentifier(eventListener.location.scriptId, WI.mainTarget)" "$PRODUCT/$RES_REL/TestCombined.js"
          fi

          # Everything other than this branch's Web Inspector changes should match WebKit's own build.
          diff -u "$RUNNER_TEMP/TestCombined.before.js" "$PRODUCT/$RES_REL/TestCombined.js" > TestCombined.diff || true
          echo "regen: TestCombined.js prebuilt -> regenerated diff: $(grep -c '^[-+][^-+]' TestCombined.diff || true) changed lines" >> ci-notes.txt
          echo "--- TestCombined.js, prebuilt vs regenerated (first 400 lines):"
          head -n 400 TestCombined.diff

      - name: Run target test x10 (with-fix)
        if: matrix.variant == 'with-fix'
        run: |
          set +e
          Tools/Scripts/run-webkit-tests --release --no-build --no-show-results --no-new-test-results \
            --force --no-retry-failures --repeat-each 10 --results-directory "$PWD/layout-test-results-target" \
            "$TARGET_TEST" 2>&1 | grep --line-buffered -v "$NOISE" | tee target.log
          status=${PIPESTATUS[0]}
          set -e
          echo "run-webkit-tests exit status: $status" | tee -a target.log
          test "$status" -eq 0 || { echo "::error::run-webkit-tests reported unexpected results"; exit 1; }
          grep -qF "All 10 tests ran as expected." target.log || { echo "::error::did not see 'All 10 tests ran as expected.'"; exit 1; }
          echo "target x10: All 10 tests ran as expected." >> ci-notes.txt

      - name: Regression suites with the fix (with-fix only)
        if: matrix.variant == 'with-fix'
        continue-on-error: true
        run: |
          set +e
          Tools/Scripts/run-webkit-tests --release --no-build --no-show-results --no-new-test-results \
            --results-directory "$PWD/layout-test-results-regressions" \
            $REGRESSION_TESTS 2>&1 | grep --line-buffered -v "$NOISE" | tee regressions.log
          status=${PIPESTATUS[0]}
          echo "run-webkit-tests exit status: $status" | tee -a regressions.log
          exit $status

      - name: Run target test once (without-fix) and check it fails the right way
        if: matrix.variant == 'without-fix'
        run: |
          set +e
          Tools/Scripts/run-webkit-tests --release --no-build --no-show-results --no-new-test-results \
            --force --no-retry-failures --results-directory "$PWD/layout-test-results-target" \
            "$TARGET_TEST" 2>&1 | grep --line-buffered -v "$NOISE" | tee target.log
          status=${PIPESTATUS[0]}
          set -e
          echo "run-webkit-tests exit status: $status" | tee -a target.log
          base="layout-test-results-target/${TARGET_TEST%.html}"
          echo "--- actual:"; cat "$base-actual.txt"
          echo "--- diff:"; cat "$base-diff.txt" || true
          test "$status" -ne 0 || { echo "::error::test passed without the fix"; exit 1; }
          for line in \
            "PASS: Should find the main frame's target." \
            "FAIL: Page listener's script should belong to the main frame target." \
            "FAIL: Page listener's script should be the page's script." \
            "FAIL: Frame listener's script should belong to the frame target." \
            "FAIL: Frame listener's script should be the frame's script."; do
            grep -qxF "$line" "$base-actual.txt" || { echo "::error::missing line: $line"; exit 1; }
            echo "found: $line" | tee -a ci-notes.txt
          done

      - name: Summary
        if: always()
        run: |
          echo "=== notes"; cat ci-notes.txt || true
          if [ "${{ matrix.variant }}" = "with-fix" ]; then
            echo "=== skipped tests in the regression suites"
            Tools/Scripts/run-webkit-tests --release --no-build --print-expectations $REGRESSION_TESTS 2>&1 \
              | grep -v "$NOISE" | grep -i "skip" || true
            python3 .github/scripts/summarize-layout-test-results.py \
              "target x10=layout-test-results-target:target.log" \
              "baseline=layout-test-results-baseline:baseline.log" \
              "regressions=layout-test-results-regressions:regressions.log"
          else
            python3 .github/scripts/summarize-layout-test-results.py \
              "target (fix reverted)=layout-test-results-target:target.log"
          fi

      - name: Upload layout test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-test-results-${{ matrix.variant }}
          path: |
            layout-test-results-target
            layout-test-results-baseline
            layout-test-results-regressions
            target.log
            baseline.log
            regressions.log
            ci-notes.txt
            revert.diff
            TestCombined.diff
          if-no-files-found: warn
